name: deploy

# The deploy runs after the tests pass on main. A manual run is also
# possible, for example to put the server back on the current commit.
on:
  workflow_run:
    workflows: [tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Two deploys must never overwrite each other. A running deploy finishes
# first, and the next one waits.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/ytdlp-web' }}
      SERVICE_NAME: ${{ vars.SERVICE_NAME || 'ytdlp-web' }}
      PUBLIC_URL: ${{ vars.PUBLIC_URL }}

    steps:
      # Deploy the exact commit that the tests ran against. The head of the
      # branch can move while the tests run, and deploying the branch head
      # would then ship code that nothing tested.
      - name: Check out the commit that passed the tests
        uses: actions/checkout@v4
        with:
          ref: >-
            ${{ github.event_name == 'workflow_run'
                && github.event.workflow_run.head_sha
                || github.sha }}

      - name: Prepare the SSH key
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # A secret pasted from a Windows terminal carries carriage returns,
          # and a private key that carries them does not load at all.
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat > ~/.ssh/config <<EOF
          Host deploy-target
            HostName ${DEPLOY_HOST}
            User ${DEPLOY_USER}
            Port ${DEPLOY_PORT}
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 15
            ServerAliveInterval 20
            ServerAliveCountMax 6
            # The server host key is not pinned. The runner accepts whichever
            # key answers on the first connection of the job, and refuses a
            # key that changes later in the same job.
            #
            # What this gives up: a party that can redirect this connection,
            # through DNS or BGP, receives the source that rsync sends and the
            # real server keeps running the old version. The SSH private key
            # is not exposed, because it never travels and only signs a
            # challenge.
            #
            # To pin the key again, put the ssh-keyscan line in a file and set
            # UserKnownHostsFile to it, with StrictHostKeyChecking yes.
            StrictHostKeyChecking accept-new
            UserKnownHostsFile ~/.ssh/known_hosts
          EOF
          chmod 600 ~/.ssh/config

      - name: Check the key before using it
        run: |
          set -uo pipefail
          fail() { echo "::error::$1"; exit 1; }
          [ -n "${DEPLOY_HOST}" ] || fail "The secret DEPLOY_HOST is not set."
          [ -n "${DEPLOY_USER}" ] || fail "The secret DEPLOY_USER is not set."
          [ -s ~/.ssh/id_ed25519 ] || fail "The secret DEPLOY_SSH_KEY is empty."
          grep -q "PRIVATE KEY" ~/.ssh/id_ed25519 || fail "DEPLOY_SSH_KEY is not a private key. Use the file without the .pub ending, whole, including its first and last lines."
          echo "the key looks usable"

      # Fail here, with a clear message, rather than inside rsync.
      - name: Check the connection
        run: ssh deploy-target 'echo "connected to $(hostname)"'

      # The runner already holds the code, so it sends the files itself.
      # The server never contacts GitHub and holds no GitHub credential.
      - name: Send the code
        run: |
          set -euo pipefail
          rsync --archive --compress --delete --human-readable \
                --exclude '.git/' \
                --exclude '.venv/' \
                --exclude '__pycache__/' \
                --exclude '.pytest_cache/' \
                --exclude 'work/' \
                ./ "deploy-target:${DEPLOY_PATH}/"

      - name: Install the dependencies and restart the service
        run: |
          set -euo pipefail
          ssh deploy-target bash -s -- "$DEPLOY_PATH" "$SERVICE_NAME" <<'REMOTE'
          set -euo pipefail
          target="$1"
          service="$2"
          cd "$target"

          # The first deploy makes the virtual environment. Later deploys
          # reuse it, because rsync never touches it.
          if [ ! -x .venv/bin/python ]; then
            echo "making the virtual environment"
            python3 -m venv .venv
            .venv/bin/python -m pip install --quiet --upgrade pip
          fi

          .venv/bin/python -m pip install --quiet --upgrade --requirement requirements.txt

          # The outbound address guard wraps the Python socket layer. An HTTP
          # backend written in C never reaches that wrapper.
          if .venv/bin/python -m pip list --format=freeze | grep -qiE '^curl[-_]cffi'; then
            echo "curl_cffi is installed. It bypasses the outbound address guard." >&2
            exit 1
          fi

          sudo -n /usr/bin/systemctl restart "$service"

          # Wait for the unit to report that it is up. A fixed sleep either
          # wastes time or reports success too early.
          for attempt in $(seq 1 30); do
            # is-active only reads state, so it needs no privilege. Using
            # sudo here would need its own sudoers rule as well, because
            # sudoers matches the whole command line, every flag included.
            if systemctl is-active --quiet "$service"; then
              echo "$service is active after ${attempt}s"
              exit 0
            fi
            sleep 1
          done

          echo "$service did not come back within 30s" >&2
          exit 1
          REMOTE

      # The service being up is not the same as the site being reachable.
      # This checks the whole path, including nginx and the certificate.
      - name: Check that the site answers
        if: env.PUBLIC_URL != ''
        run: |
          set -euo pipefail
          for attempt in $(seq 1 10); do
            # curl already prints 000 when it cannot complete the request,
            # so a fallback value here would print it a second time.
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "${PUBLIC_URL}/login") || true
            [ -n "$code" ] || code="000"
            if [ "$code" = "200" ]; then
              echo "GET ${PUBLIC_URL}/login returned 200"
              exit 0
            fi
            echo "attempt ${attempt}: got ${code}"
            sleep 3
          done
          echo "the site did not answer 200" >&2
          exit 1

      - name: Remove the key
        if: always()
        run: rm -f ~/.ssh/id_ed25519 ~/.ssh/config
