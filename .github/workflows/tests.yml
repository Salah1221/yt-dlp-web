name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # The integration tests make a one second clip with ffmpeg and serve it
      # on the loopback address. No video site is used.
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install the dependencies
        run: python -m pip install --upgrade -r requirements-dev.txt

      # The outbound address guard wraps the Python socket layer. An HTTP
      # backend written in C opens its sockets inside the C library and never
      # reaches the wrapper, which turns the guard off with no warning.
      - name: Refuse a C level HTTP backend
        run: |
          if python -m pip list --format=freeze | grep -qiE '^curl[-_]cffi'; then
            echo "curl_cffi is installed. It bypasses the outbound address guard."
            exit 1
          fi
          echo "no C level HTTP backend is installed"

      - name: Run the tests
        run: python -m pytest -q
