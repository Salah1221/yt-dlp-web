# nginx site file for ytdlp-web.
# Install it as /etc/nginx/sites-available/ytdlp-web and link it into sites-enabled.
#
# CHANGE THESE LINES BEFORE YOU USE THIS FILE:
#   1. every "example.com" and "www.example.com" in the two server_name lines
#   2. the ssl_certificate path
#   3. the ssl_certificate_key path
# Nothing else needs an edit for a standard install.

# ---------------------------------------------------------------------------
# http level directives.
# The two blocks below belong at "http" level, not inside a server block.
# A Debian or Ubuntu site file is included inside "http", so they work here.
# If your nginx includes this file somewhere else, move these two blocks to
# /etc/nginx/nginx.conf or to a snippet in /etc/nginx/conf.d/.
# ---------------------------------------------------------------------------

# Maps the client Upgrade header to the value of the Connection header we send
# upstream. A normal request gets "close". A WebSocket request gets "upgrade".
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Rate limit state for the login route. 10 MB holds about 160000 addresses.
# 5r/m means 5 requests per minute per client address.
limit_req_zone $binary_remote_addr zone=ytdlp_login:10m rate=5r/m;

# Hides the nginx version in error pages and in the Server header.
server_tokens off;

# ---------------------------------------------------------------------------
# Port 80: redirect every request to HTTPS.
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;

    # CHANGE: your domain names.
    server_name example.com www.example.com;

    return 301 https://$host$request_uri;
}

# ---------------------------------------------------------------------------
# Port 443: the real site.
# ---------------------------------------------------------------------------
server {
    # On nginx 1.25.1 and later, write "listen 443 ssl;" and add "http2 on;".
    # The form below works on nginx 1.18 and 1.22 (Ubuntu 22.04, Debian 12).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    # CHANGE: your domain names.
    server_name example.com www.example.com;

    # CHANGE: the path of your certificate file.
    # This file holds the leaf certificate first, then the intermediates.
    ssl_certificate     /etc/ssl/ytdlp-web/fullchain.pem;
    # CHANGE: the path of your private key file. Mode 600, owner root.
    ssl_certificate_key /etc/ssl/ytdlp-web/privkey.pem;

    # Modern TLS only. TLS 1.0 and TLS 1.1 stay off.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Tells the browser to use HTTPS for this host for the next year.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Security headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # The request bodies are short, because they only carry a URL and options.
    client_max_body_size 1m;

    # The application streams the file itself, so nginx must not add a limit here.
    proxy_max_temp_file_size 0;

    # -----------------------------------------------------------------------
    # WebSocket for the progress bar.
    # Without this block the Upgrade handshake fails, the browser closes the
    # socket, and the page falls back to slow polling without an error. The
    # progress bar then looks frozen, and nothing in the log says why.
    # -----------------------------------------------------------------------
    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A long download sends no progress message for minutes at a time.
        # A short timeout would close the socket in the middle of a job.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # -----------------------------------------------------------------------
    # API routes, including the file download.
    # proxy_buffering must stay off. With buffering on, nginx reads the whole
    # download to its own disk before it sends the first byte to the browser.
    # That makes the browser wait, and it puts a second copy of the file on
    # the server.
    # -----------------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_request_buffering off;

        # A probe or a job can hold the connection open for a long time.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 60s;
    }

    # -----------------------------------------------------------------------
    # Login route. The rate limit slows a password guesser at the proxy.
    # The application checks the password as well. This is the second layer.
    # burst=3 allows a short run of retries. nodelay serves them at once.
    # A client over the limit gets 429.
    # This block must come after "location /api/", because an exact match
    # wins over a prefix match.
    # -----------------------------------------------------------------------
    location = /api/login {
        limit_req zone=ytdlp_login burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # -----------------------------------------------------------------------
    # Everything else: the pages and the static files.
    # -----------------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
